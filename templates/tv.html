<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>{{ show.name }} - MovieBox</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.back {
    color: #aaa;
    text-decoration: none;
}

.back:hover {
    color: white;
}

.show-info {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 35px;
    margin:
        30px 0 45px;
}

.poster {
    width: 100%;
    border-radius: 10px;
}

.details h1 {
    font-size: 42px;
    margin-top: 0;
}

.rating {
    color: #ffc107;
}

.overview {
    color: #bbb;
    line-height: 1.7;
}

.controls {
    display: flex;
    gap: 15px;
    margin-bottom: 25px;
}

select {
    background: #1c1c1c;
    color: white;
    border: 1px solid #333;
    padding: 12px 15px;
    border-radius: 6px;
    font-size: 15px;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 10px;
    overflow: hidden;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}


@media (max-width: 700px) {

    .show-info {
        grid-template-columns: 1fr;
    }

    .poster {
        max-width: 280px;
    }

    .details h1 {
        font-size: 32px;
    }

    .controls {
        flex-direction: column;
    }

}

</style>

</head>


<body>


<div class="container">


<a
    href="/"
    class="back"
>
    ← Back to Home
</a>



<div class="show-info">


    {% if show.poster_path %}

    <img
        class="poster"
        src="https://image.tmdb.org/t/p/w780{{ show.poster_path }}"
        alt="{{ show.name }}"
    >

    {% endif %}


    <div class="details">

        <h1>
            {{ show.name }}
        </h1>


        <p class="rating">

            ⭐
            {{ "%.1f"|format(show.vote_average) }}
            / 10

        </p>


        <p>

            First aired:
            {{ show.first_air_date or "N/A" }}

        </p>


        <p class="overview">

            {{ show.overview }}

        </p>

    </div>


</div>



<h2>
    📺 Watch Episodes
</h2>


<div class="controls">


    <select id="seasonSelect">

        {% for season in show.seasons %}

            {% if season.season_number > 0 %}

            <option
                value="{{ season.season_number }}"
            >
                Season {{ season.season_number }}
            </option>

            {% endif %}

        {% endfor %}

    </select>


    <select id="episodeSelect">

        <option value="1">
            Episode 1
        </option>

    </select>


</div>



<div class="player">

    <iframe
        id="player"
        src=""
        allowfullscreen>
    </iframe>

</div>


</div>



<script>

const tvId = "{{ show.id }}";

const apiKey = "{{ nexstream_api_key if nexstream_api_key else '' }}";

const seasonSelect =
    document.getElementById("seasonSelect");

const episodeSelect =
    document.getElementById("episodeSelect");

const player =
    document.getElementById("player");


// Load episodes for selected season

async function loadEpisodes(seasonNumber) {

    const response = await fetch(
        `/api/tv/${tvId}/season/${seasonNumber}`
    );

    const data = await response.json();

    episodeSelect.innerHTML = "";

    data.episodes.forEach(episode => {

        const option =
            document.createElement("option");

        option.value =
            episode.episode_number;

        option.textContent =
            `Episode ${episode.episode_number} - ${episode.name}`;

        episodeSelect.appendChild(option);

    });

    updatePlayer();

}


// Update player

function updatePlayer() {

    const season =
        seasonSelect.value;

    const episode =
        episodeSelect.value;

    const url =
        `/tv-player/${tvId}/${season}/${episode}`;

    player.src = url;

}


seasonSelect.addEventListener(
    "change",
    () => loadEpisodes(seasonSelect.value)
);


episodeSelect.addEventListener(
    "change",
    updatePlayer
);


// Load first season

if (seasonSelect.value) {

    loadEpisodes(
        seasonSelect.value
    );

}

</script>


</body>

</html>
