<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            MovieBox
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/main.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/components.css') }}"
    >

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/live.css') }}"
    >

    {% block page_css %}{% endblock %}

</head>

<body>

    {% include "components/navbar.html" %}

    {% block content %}{% endblock %}

    <script
        src="{{ url_for('static', filename='js/main.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/search.js') }}"
    ></script>

    {% block page_js %}{% endblock %}

</body>

</html>
