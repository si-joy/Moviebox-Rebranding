<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>{{ movie.title }} - MovieBox</title>


<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 1200px;
    margin: auto;
    padding: 40px 20px;
}

.back {
    color: #aaa;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 30px;
}

.back:hover {
    color: white;
}

.movie-info {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 35px;
    margin-bottom: 45px;
}

.poster {
    width: 100%;
    border-radius: 10px;
}

.details h1 {
    font-size: 42px;
    margin-top: 0;
}

.rating {
    color: #ffc107;
    margin-bottom: 15px;
}

.meta {
    color: #888;
    margin-bottom: 25px;
}

.overview {
    color: #bbb;
    line-height: 1.7;
    max-width: 800px;
}

.section-title {
    margin:
        35px 0 20px;
}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 10px;
    overflow: hidden;
}

.player iframe {
    width: 100%;
    height: 100%;
    border: 0;
}

.trailer iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 0;
    border-radius: 10px;
}


@media (max-width: 700px) {

    .movie-info {
        grid-template-columns: 1fr;
    }

    .poster {
        max-width: 280px;
    }

    .details h1 {
        font-size: 32px;
    }

}

</style>

</head>


<body>


<div class="container">


<a
    href="/"
    class="back"
>
    ← Back to Home
</a>


<div class="movie-info">


    {% if movie.poster_path %}

    <img
        class="poster"
        src="https://image.tmdb.org/t/p/w780{{ movie.poster_path }}"
        alt="{{ movie.title }}"
    >

    {% endif %}


    <div class="details">

        <h1>
            {{ movie.title }}
        </h1>


        <div class="rating">

            ⭐
            {{ "%.1f"|format(movie.vote_average) }}
            / 10

        </div>


        <div class="meta">

            Release:
            {{ movie.release_date or "N/A" }}

        </div>


        <p class="overview">

            {{ movie.overview }}

        </p>

    </div>


</div>



<!-- PLAYER -->

<h2 class="section-title">
    ▶ Watch Movie
</h2>


<div class="player">

    <iframe
        src="{{ stream_url }}"
        allowfullscreen>
    </iframe>

</div>



<!-- TRAILER -->

{% if trailer %}

<h2 class="section-title">
    Official Trailer
</h2>


<div class="trailer">

    <iframe
        src="https://www.youtube.com/embed/{{ trailer.key }}"
        allowfullscreen>
    </iframe>

</div>

{% endif %}


</div>

</body>

</html>
