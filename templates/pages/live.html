{% extends "base.html" %}

{% block content %}

<section class="live-page">

    <div class="live-header">
        <div>
            <span class="live-badge">● LIVE TV</span>
            <h1>Live Television</h1>
            <p>Watch live TV channels from your browser.</p>
        </div>
    </div>

    <div class="live-layout">

        <!-- Channel List -->
        <aside class="channel-sidebar">

            <h3>Channels</h3>

            {% for channel in channels %}

            <button
                class="channel-item {% if loop.first %}active{% endif %}"
                onclick="loadChannel(
                    '{{ channel.embed_url }}',
                    '{{ channel.name }}',
                    this
                )"
            >

                <img
                    src="{{ channel.logo }}"
                    alt="{{ channel.name }}"
                >

                <div>
                    <strong>{{ channel.name }}</strong>
                    <span>LIVE</span>
                </div>

            </button>

            {% endfor %}

        </aside>


        <!-- Player -->
        <main class="live-player-area">

            <div class="player-topbar">
                <div>
                    <span class="live-dot"></span>
                    <span id="channel-name">Star Jalsha</span>
                </div>
            </div>

            <div class="video-container">

                <iframe
                    id="live-player"
                    src="{{ channels[0].embed_url }}"
                    title="Star Jalsha Live"
                    frameborder="0"
                    allow="autoplay; fullscreen"
                    allowfullscreen>
                </iframe>

            </div>

        </main>

    </div>

</section>

{% endblock %}

<script>

function loadChannel(url, name, button) {

    const player = document.getElementById("live-player");
    const channelName = document.getElementById("channel-name");

    // Change player
    player.src = url;

    // Change title
    channelName.textContent = name;

    // Remove active state
    document.querySelectorAll(".channel-item").forEach(item => {
        item.classList.remove("active");
    });

    // Add active state
    button.classList.add("active");
}

</script>
