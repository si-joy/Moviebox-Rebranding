
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Interstellar</title>


<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    background: #090909;

    color: white;

    font-family: Arial, sans-serif;

}

.container {

    max-width: 1200px;

    margin: auto;

    padding: 40px 20px;

}


.back {

    display: inline-block;

    color: #aaa;

    text-decoration: none;

    margin-bottom: 30px;

}

.back:hover {

    color: white;

}


.movie-header {

    display: grid;

    grid-template-columns: 280px 1fr;

    gap: 35px;

    margin-bottom: 40px;

}


.poster {

    width: 100%;

    border-radius: 10px;

}


.movie-content h1 {

    font-size: 40px;

    margin-top: 0;

    margin-bottom: 15px;

}


.rating {

    color: #ffc107;

    margin-bottom: 15px;

}

.player {
    width: 100%;
    aspect-ratio: 16 / 9;
    overflow: hidden;
}

.meta {

    color: #999;

    margin-bottom: 25px;

}


.overview {

    color: #ccc;

    line-height: 1.7;

    max-width: 800px;

}


.section-title {

    font-size: 24px;

    margin: 40px 0 20px;

}


.player {

    width: 100%;

    aspect-ratio: 16 / 9;

    background: black;

    border-radius: 10px;

    overflow: hidden;

}


.player iframe {

    width: 100%;

    height: 100%;

    border: none;

}


.trailer {

    margin-top: 40px;

}


.trailer iframe {

    width: 100%;

    aspect-ratio: 16 / 9;

    border: none;

    border-radius: 10px;

}


@media (max-width: 700px) {

    .movie-header {

        grid-template-columns: 1fr;

    }

    .poster {

        max-width: 280px;

    }

    .movie-content h1 {

        font-size: 30px;

    }

}

</style>

</head>


<body>


<div class="container">


<a href="movies.html" class="back">
    ← Back to Movies
</a>


<div class="movie-header">


    <div>

        <img
            class="poster"
            src="https://image.tmdb.org/t/p/w780/yQvGrMoipbRoddT0ZR8tPoR7NfX.jpg"
            alt="Interstellar"
        >

    </div>


    <div class="movie-content">

        <h1>Interstellar</h1>

        <div class="rating">
            ⭐ 8.5 / 10
        </div>

        <div class="meta">
            Release: 2014-11-05
        </div>

        <p class="overview">
            The adventures of a group of explorers who make use of a newly discovered wormhole to surpass the limitations on human space travel and conquer the vast distances involved in an interstellar voyage.
        </p>

    </div>


</div>


<h2 class="section-title">
    ▶ Watch Movie
</h2>


<div class="player">

    <iframe
        src="https://api.codespecters.com/embed/movie/157336?apikey=nx_84b5391094762294c283219e55424d6f"
        allowfullscreen>
    </iframe>

</div>




<div class="trailer">

    <h2 class="section-title">
        Official Trailer
    </h2>

    <iframe
        src="https://www.youtube.com/embed/LY19rHKAaAg"
        allowfullscreen>
    </iframe>

</div>



</div>

</body>

</html>
